name: 機能要望
description: 新機能や既存機能の改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: ユースケース
      description: どんな場面で困っているか、何を実現したいか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案（任意）
      description: 考えている解決策や、検討した代替案
