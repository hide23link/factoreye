name: バグ報告
description: 動作が仕様と異なる、エラーになる、などの不具合を報告する
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 何が起きたか
      description: 期待した動作と、実際の動作
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / コミット
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      placeholder: OS / Docker / ブラウザ / self-hosted か SaaS か
  - type: textarea
    id: logs
    attributes:
      label: ログ・エラーメッセージ
      description: 機密情報は除いてください。
      render: shell
