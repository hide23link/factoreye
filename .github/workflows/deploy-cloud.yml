name: deploy-cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/cloud/**"
      - "alembic/**"
      - "docker-compose.cloud.yml"

jobs:
  deploy:
    runs-on: [self-hosted, proxmox]
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/factoreye
          git pull origin main
          docker compose -f docker-compose.cloud.yml up -d --build
          echo "Deploy complete: $(date)"
