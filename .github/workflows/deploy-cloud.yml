name: deploy-cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/cloud/**"
      - "alembic/**"
      - "docker-compose.cloud.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -q && sudo apt-get install -y cloudflared

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # cloudflared を ProxyCommand として使用して Tunnel 経由で SSH
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.factoreye.hide23.link
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: Deploy to Proxmox LXC102
        run: |
          ssh factoreye@ssh.factoreye.hide23.link << 'ENDSSH'
            set -euo pipefail
            cd /opt/factoreye
            git pull origin main
            docker compose -f docker-compose.cloud.yml up -d --build
            echo "Deploy complete: $(date)"
          ENDSSH
