# 秘密値（キー・トークン・秘密鍵など）がコミットに入っていないか検査する。
# ローカルの .githooks/pre-commit を使わなかった場合の、最後の確認。
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を入れる
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: 履歴全体を検査する
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml
