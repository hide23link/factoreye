name: e2e-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    # 自宅LXC 102 self-hosted runner登録後は `runs-on: self-hosted` に切替（docs/factoreye-architecture.md §Infrastructure参照）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        run: curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:8000/health

      - name: Wait for frontend
        run: curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3001

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
