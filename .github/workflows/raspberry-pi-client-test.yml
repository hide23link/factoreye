name: raspberry-pi-client-test

on:
  push:
    paths: ["clients/raspberry-pi/**", ".github/workflows/raspberry-pi-client-test.yml"]
  pull_request:
    paths: ["clients/raspberry-pi/**", ".github/workflows/raspberry-pi-client-test.yml"]

defaults:
  run:
    working-directory: clients/raspberry-pi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
