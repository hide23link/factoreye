name: recovery-tool-test

on:
  push:
    branches: [main]
    paths: ["tools/recovery/**", ".github/workflows/recovery-tool-test.yml"]
  pull_request:
    paths: ["tools/recovery/**", ".github/workflows/recovery-tool-test.yml"]

defaults:
  run:
    working-directory: tools/recovery

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # バックアップの展開先（作業用の Postgres）。本番と同じ 15 系
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: factoreye
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoreye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_SCRATCH_DSN: postgresql://factoreye:password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/recovery/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # DB のテストは psql でバックアップを流し込む。無ければ飛ばされるため、先に有無を確かめる
      - name: Check psql
        run: psql --version

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy .

      - name: Lint
        run: ruff check .

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Build image
        run: docker build -t factoreye-recovery:ci .
