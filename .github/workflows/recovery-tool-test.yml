name: recovery-tool-test

on:
  push:
    branches: [main]
    paths: ["tools/recovery/**", ".github/workflows/recovery-tool-test.yml"]
  pull_request:
    paths: ["tools/recovery/**", ".github/workflows/recovery-tool-test.yml"]

defaults:
  run:
    working-directory: tools/recovery

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # バックアップの展開先（作業用の Postgres）。本番と同じ 15 系
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: factoreye
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoreye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_SCRATCH_DSN: postgresql://factoreye:password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/recovery/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # runner の pg_dump / psql は新しい版（17 以降）で、15 系のサーバーが知らない設定
      # （transaction_timeout）を含むダンプを作る。サーバーと同じ 15 系のクライアントを使う
      - name: Install PostgreSQL 15 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"

      # DB のテストは psql でバックアップを流し込む。無ければ飛ばされるため、先に有無を確かめる
      - name: Check psql
        run: psql --version

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy .

      - name: Lint
        run: ruff check .

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Build image
        run: docker build -t factoreye-recovery:ci .
