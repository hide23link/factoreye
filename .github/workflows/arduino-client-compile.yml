name: arduino-client-compile

on:
  push:
    paths: ["clients/arduino-m5stack/**", ".github/workflows/arduino-client-compile.yml"]
  pull_request:
    paths: ["clients/arduino-m5stack/**", ".github/workflows/arduino-client-compile.yml"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile SendReading example for M5Stack Atom
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:m5stack_atom \
            --library clients/arduino-m5stack \
            --warnings all \
            clients/arduino-m5stack/examples/SendReading
