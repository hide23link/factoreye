name: backend-test

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-test.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    # 自宅LXC 102 self-hosted runner登録後は `runs-on: self-hosted` に切替（docs/factoreye-architecture.md §Infrastructure参照）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: factoreye
          POSTGRES_PASSWORD: password
          POSTGRES_DB: factoreye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoreye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy .

      - name: Lint
        run: ruff check .

      - name: Dependency audit
        run: pip-audit
