services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://factoreye:password@postgres:5432/factoreye
      - INGEST_API_KEY=change-this-in-production
      - JWT_SECRET=change-this-in-production
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3001:3001"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=factoreye
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=factoreye
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoreye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  default:
    name: factoreye
