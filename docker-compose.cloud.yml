# FactorEye Cloud — 本番（クラウド版）用 Docker Compose
# TLS は Cloudflare Tunnel が処理。Caddy は :80 のみ。
# 使い方: docker compose -f docker-compose.cloud.yml up -d --build
# .env に DOMAIN / POSTGRES_PASSWORD / INGEST_API_KEY / JWT_SECRET を設定すること（infra/cloud/.env.cloud.example 参照）

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 127.0.0.1 だけで待ち受ける。外部からは Cloudflare Tunnel（cloudflared）経由でのみ届く。
      # 全員に公開すると、CF-Connecting-IP（レート制限の鍵）を偽装されるため
      - "127.0.0.1:80:80"
    volumes:
      - ./infra/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://factoreye:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@postgres:5432/factoreye
      - INGEST_API_KEY=${INGEST_API_KEY:?INGEST_API_KEY を .env に設定してください}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET を .env に設定してください}
      - ENVIRONMENT=production
      # CORS 許可オリジン。Cloudflare Tunnel のドメインを設定する
      - FRONTEND_URL=https://${DOMAIN:?DOMAIN を .env に設定してください}
      - AUTH_MODE=multi_tenant
      # 管理画面の「書き戻し」が呼ぶ、復旧ツール（tools/recovery。同じネットワーク factoreye-cloud に入る）。
      # パスワードは .env に設定する（復旧ツールの RECOVERY_PASSWORD と同じ値）。空なら書き戻しは使えない
      - FAILBACK_RECOVERY_URL=${FAILBACK_RECOVERY_URL:-http://recovery:8090}
      - FAILBACK_RECOVERY_USERNAME=${FAILBACK_RECOVERY_USERNAME:-admin}
      - FAILBACK_RECOVERY_PASSWORD=${FAILBACK_RECOVERY_PASSWORD:-}
    volumes:
      # 管理者アカウント（ID:bcryptハッシュ）をホストに置く。DBには入れない。
      # 初回は ./admin/admins.txt を作成し、app.admin_cli set-admin で管理者を追加する
      - ./admin:/app/admin
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite はビルド時に API URL を静的ファイルへ焼き込む
        # /api/* は Caddy が backend:8000 へルーティングするため同一ドメインを指定
        VITE_API_URL: https://${DOMAIN:?DOMAIN を .env に設定してください}
        VITE_AUTH_MODE: multi_tenant
    restart: unless-stopped
    depends_on:
      - backend

  postgres:
    # postgres:15（Debian）に WAL-G を足したイメージ（DR のバックアップ用。infra/cloud/postgres/Dockerfile）
    build: ./infra/cloud/postgres
    image: factoreye-postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=factoreye
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      - POSTGRES_DB=factoreye
    # WAL-G の設定（R2 の鍵を含む。Git 管理外。権限 600）。無くても PostgreSQL は起動する（archive_mode は、init.sh を実行するまで off）
    env_file:
      - path: /opt/factoreye/walg/walg.env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoreye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  default:
    name: factoreye-cloud
