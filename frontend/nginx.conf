# ビルド済みの静的ファイル（dist/）を配信する。Vite preview（開発用サーバー）は使わない
server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 配布版（install/）は画面と API を同じ入口（このポート）で見せる。
    # backend が停止中でも nginx が起動できるよう、名前の解決を実行時に行う（変数 + resolver）
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # backend のレート制限は CF-Connecting-IP を接続元とみなす（app/rate_limit.py）。
        # ここで上書きしないと、全機器が nginx の IP 1 つにまとまり、制限を共有してしまう。
        # クライアントが送った同名ヘッダーは、この指定で置き換わる（偽装できない）
        proxy_set_header CF-Connecting-IP $remote_addr;
        # 取り込みの本文待ち・書き出しなど、長めの処理がある
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    # Viteはファイル名にハッシュを付けるため、assets配下は長期キャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: 存在しないパスは index.html を返す。
    # index.html は毎回確かめさせる（デプロイでチャンクのハッシュが変わるため、古い index.html を使い続けさせない）
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
