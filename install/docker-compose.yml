# FactorEye 配布版（OSS / self-hosted）の Docker Compose。ビルドは不要で、公開済みのイメージを取得して動かす。
#
# 使い方: install.sh が /opt/factoreye にこのファイルと config/.env を置いて起動する。手動なら、
#   mkdir config && cp .env.template config/.env
#   （config/.env の __GENERATE__ を書き換える）
#   docker compose --env-file config/.env up -d
#
# 設定は config/.env の 1 ファイルに集約している（テキストで編集してよい。画面の設定タブからも変えられる）。
# compose の変数（ポート・DB パスワード・版）も、同じファイルから読む（--env-file config/.env）。
# 注意: backend には設定の値を `environment:` で渡さない。環境変数は .env より優先されるため、
#       画面から .env を書き換えても反映されなくなる。backend は /app/config/.env を直接読む。

services:
  backend:
    image: ${FACTOREYE_IMAGE_PREFIX:-ghcr.io/hide23link}/factoreye-backend:${FACTOREYE_VERSION:-latest}
    restart: unless-stopped
    volumes:
      # 画面の設定タブが、この中の .env を書き換えて、backend 自身を再起動する。
      # （ディレクトリごとマウントする理由は backend/app/env_file.py の冒頭を参照）
      # .env.bak は、画面で保存する直前の内容。`./factoreye.sh restore-env` で戻せる
      - ./config:/app/config
    environment:
      # 設定ファイルの場所だけを渡す（設定の値は渡さない）
      - FACTOREYE_ENV_FILE=/app/config/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ${FACTOREYE_IMAGE_PREFIX:-ghcr.io/hide23link}/factoreye-frontend:${FACTOREYE_VERSION:-latest}
    restart: unless-stopped
    ports:
      # 画面と API の入口はこの 1 つだけ（/api は、frontend の nginx が backend へ転送する）
      - "${FACTOREYE_PORT:-3001}:3001"
    depends_on:
      - backend

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=factoreye
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      - POSTGRES_DB=factoreye
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # ポートは公開しない（DB は同じ compose の中からだけ使う）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoreye"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  default:
    name: factoreye
