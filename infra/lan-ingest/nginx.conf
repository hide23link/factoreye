# LAN 向けの「取り込み専用の窓口」の nginx 設定（docker-compose.lan-ingest.yml が /etc/nginx/conf.d/default.conf に差し込む）。
#
# 機器（M5Stack など）→ この窓口（LAN のポート）→ backend（コンテナの中の 8000）
# 通すのは次の 2 つだけ。ほかはすべて 404（画面・管理者 API・センサーの一覧などは LAN に出さない）:
#   POST /api/ingest/readings   センサー値の取り込み
#   GET  /health                動作確認用
#
# INGEST_AUTH=off（キーなしの取り込み）で動かすときの前提の窓口。使い方は README.md。
# /health の連打で backend（DB）に負担をかけないよう、接続元ごとに 1 回/秒（バーストは 5 回）まで
limit_req_zone $binary_remote_addr zone=health:1m rate=1r/s;

server {
    listen 8080;
    server_tokens off;

    # 取り込み以外（この窓口では /health だけ）は、小さい本文だけ通す。取り込みの場所だけ、下で大きくする
    client_max_body_size 256k;
    client_body_buffer_size 256k;  # 約 30KB のバッチをメモリのまま扱う（既定の 16KB だと一時ファイルに書く）
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 私設アドレス（LAN）からの接続だけ受ける。ルーターのポート転送などでインターネットから届いても、送信元が公開アドレスなら
    # 通す 2 つの URL は 403 にする（それ以外の URL は 404、大きすぎる本文は 413 になる。いずれも backend には届かない）
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # コンテナの DNS（127.0.0.11）で名前を引き直す。backend を作り直して IP が変わっても、nginx の再起動が要らない
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location = /api/ingest/readings {
        limit_except POST { deny all; }  # POST 以外は 403
        # 時刻ごとのまとめ送り（samples）は、最大 70,000 件で約 1.3MB になる。backend の上限（8MB）に合わせる
        client_max_body_size 8m;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend;  # 機器が付けた Host や、Host なしの要求に左右されない（backend は Host を使わない）
        # backend は、レート制限の鍵に CF-Connecting-IP を使う（app/rate_limit.py）。
        # 機器が付けた値は捨て、nginx が見た接続元を入れる（偽装で制限を避けられない。機器ごとに数える）
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /health {
        limit_except GET { deny all; }
        limit_req zone=health burst=5 nodelay;
        access_log off;  # 動作確認の連打でログが膨らまないように

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
