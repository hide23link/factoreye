# LAN 向けの取り込み専用の窓口（nginx）を足す。使い方は README.md。
#
#   LAN_INGEST_BIND=192.168.0.72 docker compose -f docker-compose.yml -f infra/lan-ingest/docker-compose.lan-ingest.yml up -d
#
# LAN_INGEST_BIND: 窓口を開く、このホストの LAN の IP（必須）。0.0.0.0 にしない（Tailscale など、ほかの口にも開くため）
# LAN_INGEST_PORT: 窓口のポート（既定 8001）。backend の 8000 は今のまま（127.0.0.1 だけ）
services:
  lan-ingest:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAN_INGEST_BIND:?LAN_INGEST_BIND に、このホストの LAN の IP（例: 192.168.0.72）を設定してください}:${LAN_INGEST_PORT:-8001}:8080"
    volumes:
      - ./infra/lan-ingest/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
