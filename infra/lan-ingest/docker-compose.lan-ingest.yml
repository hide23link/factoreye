# LAN 向けの取り込み専用の窓口（nginx）を足す。使い方は README.md。
#
#   LAN_INGEST_BIND=192.168.0.10 docker compose -f docker-compose.yml -f infra/lan-ingest/docker-compose.lan-ingest.yml up -d
#
# LAN_INGEST_BIND: 窓口を開く、このホストの LAN の IP。0.0.0.0 にしない（Tailscale など、ほかの口にも開くため）。
#                  未設定なら 127.0.0.1（このホストの中だけ。LAN の機器からは届かない）。止める・ログを見るときは未設定でよい
# LAN_INGEST_PORT: 窓口のポート（既定 8001）。backend の 8000 は今のまま（127.0.0.1 だけ）
services:
  lan-ingest:
    image: nginx:1.30-alpine  # 安定版（偶数の系列）。更新するときは、このタグを上げる
    restart: unless-stopped
    ports:
      - "${LAN_INGEST_BIND:-127.0.0.1}:${LAN_INGEST_PORT:-8001}:8080"
    volumes:
      - ./infra/lan-ingest/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    # アクセスログが Docker の既定（無制限）で溜まって、SD カードを埋めないように
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
