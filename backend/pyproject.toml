[project]
name = "factoreye-backend"
version = "0.1.0"
description = "FactorEye backend — REST ingest API + REST API (FastAPI/SQLModel)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic autogenerateの生成物は手で整形するものではない（業界標準の慣行）
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPIの Depends()/Query() はデフォルト引数での呼び出しが公式に推奨される書き方
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# alembic autogenerateの生成物は手で厳密型付けするものではない（業界標準の慣行）
exclude = ["^alembic/versions/"]

[tool.coverage.run]
# SQLAlchemyの非同期エンジンはDBAPI呼び出しをgreenlet経由で実行するため、
# デフォルトのスレッドトレーサーだけでは app/api/ 配下の大半が未計測として
# 誤計測される（coverage.py公式のgreenlet対応設定）。
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db.session.engine はモジュールレベルの単一インスタンス（単一イベントループ前提）のため、
# テストも同一セッションスコープのイベントループを共有する（テスト毎に別ループだとasyncpgが
# "another operation is in progress" で落ちる）
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
